spring:
  application:
    name: sigoh-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sigoh}
    username: ${DB_USER:sigoh}
    password: ${DB_PASSWORD:sigoh}

  jpa:
    hibernate:
      # O schema e propriedade exclusiva do Flyway. 'validate' faz a aplicacao
      # recusar subir se as entidades e as tabelas divergirem - falha cedo e
      # explicitamente, em vez de alterar o banco por conta propria.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

sigoh:
  jwt:
    # Em producao esta chave vem de variavel de ambiente, nunca do arquivo.
    secret: ${JWT_SECRET:chave-de-desenvolvimento-com-no-minimo-32-bytes-troque-em-producao}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    com.sigoh.api: DEBUG
